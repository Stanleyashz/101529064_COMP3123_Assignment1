$kind: http-request
url: "{{baseUrl}}/api/v1/emp/employees/{{eidA}}"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Returns 200', () => pm.response.to.have.status(200));
      pm.test('Returns the requested employee', () => pm.expect(pm.response.json().employee._id).to.eql(pm.collectionVariables.get('eidA')));
    language: text/javascript
order: 3000
