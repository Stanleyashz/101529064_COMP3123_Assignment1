$kind: http-request
url: "{{baseUrl}}/api/v1/emp/employees"
method: GET
headers:
  Authorization: Bearer {{tamperedToken}}
scripts:
  - type: beforeRequest
    code: |-
      const token = pm.collectionVariables.get('token') || '';
      if (!token) {
        pm.collectionVariables.set('tamperedToken', 'invalid-token');
      } else {
        const last = token.slice(-1);
        pm.collectionVariables.set('tamperedToken', token.slice(0, -1) + (last === 'a' ? 'b' : 'a'));
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Returns 401', () => pm.response.to.have.status(401));
      pm.test('Invalid token code', () => pm.expect(pm.response.json().error.code).to.eql('INVALID_TOKEN'));
    language: text/javascript
order: 11000
