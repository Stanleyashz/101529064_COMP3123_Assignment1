$kind: http-request
url: "{{baseUrl}}/api/v1/emp/employees/not-an-object-id"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Returns 400', () => pm.response.to.have.status(400));
      pm.test('Invalid id code', () => pm.expect(pm.response.json().error.code).to.eql('INVALID_ID'));
    language: text/javascript
order: 12000
