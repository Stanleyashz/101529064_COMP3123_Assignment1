$kind: http-request
url: "{{baseUrl}}/api/v1/emp/employees"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: '{"first_name":"Sam","last_name":"Lee","email":"sam3{{runId}}@example.com","position":"Engineer","salary":85000,"date_of_joining":"not-a-date","department":"Engineering"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Returns 400', () => pm.response.to.have.status(400));
      pm.test('Details mention date_of_joining', () => pm.expect(JSON.stringify(pm.response.json().error.details)).to.include('date_of_joining'));
    language: text/javascript
order: 8000
