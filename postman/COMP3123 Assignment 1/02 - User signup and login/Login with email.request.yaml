$kind: http-request
url: "{{baseUrl}}/api/v1/user/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"email":"alice{{runId}}@example.com","password":"StrongPass123"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Returns 200', () => pm.response.to.have.status(200));
      pm.test('JWT returned', () => pm.expect(pm.response.json().token).to.be.a('string').and.not.empty);
    language: text/javascript
order: 8000
