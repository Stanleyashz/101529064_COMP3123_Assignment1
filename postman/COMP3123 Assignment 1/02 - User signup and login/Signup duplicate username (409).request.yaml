$kind: http-request
url: "{{baseUrl}}/api/v1/user/signup"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"username":"alice{{runId}}","email":"alice{{runId}}@example.com","password":"StrongPass123"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Returns 409', () => pm.response.to.have.status(409));
      pm.test('Duplicate account code', () => pm.expect(pm.response.json().error.code).to.eql('DUPLICATE_ACCOUNT'));
    language: text/javascript
order: 2000
