$kind: http-request
url: "{{baseUrl}}/api/v1/user/signup"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"username":"weakpass{{runId}}","email":"weakpass{{runId}}@example.com","password":"onlyletters"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Returns 400', () => pm.response.to.have.status(400));
      pm.test('Details mention password', () => pm.expect(JSON.stringify(pm.response.json().error.details)).to.include('password'));
    language: text/javascript
order: 5000
