$kind: http-request
url: "{{baseUrl}}/api/v1/user/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"username":"alice{{runId}}","password":"StrongPass123"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Returns 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('JWT returned', () => pm.expect(body.token).to.be.a('string').and.not.empty);
      pm.collectionVariables.set('token', body.token);
    language: text/javascript
order: 7000
