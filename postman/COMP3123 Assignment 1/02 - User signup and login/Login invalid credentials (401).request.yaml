$kind: http-request
url: "{{baseUrl}}/api/v1/user/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"username":"alice{{runId}}","password":"WrongPass123"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Returns 401', () => pm.response.to.have.status(401));
      pm.test('Invalid credentials code', () => pm.expect(pm.response.json().error.code).to.eql('INVALID_CREDENTIALS'));
    language: text/javascript
order: 9000
